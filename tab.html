<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script type="module" src="src/i18n.js"></script>
  <link rel="icon" type="image/png" href="icons/bookmark-32.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Текущая вкладка · Полка закладок</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/popup-size.js"></script>
  <script type="module" src="src/scrollbars.js"></script>
  <script src="vendor/sql-wasm.js"></script>
  <script type="module" src="src/tab.js"></script>
</head>
<body class="tab-page">
  <header>
    <strong>Текущая вкладка</strong>
    <a class="settings-button library-link" href="popup.html?from=tab">Закладки и ресурсы</a>
    <a class="expand settings-link" href="settings.html?from=tab" title="Настройки" aria-label="Настройки"></a>
  </header>
  <main class="tab-content">
    <section class="tab-info" aria-labelledby="tab-title">
      <h1 id="tab-title">Загрузка…</h1>
      <p id="tab-url"></p>
      <p id="tab-bookmark-info"></p>
      <label id="tab-bookmark-choice" hidden>Сохранить в закладку<select id="tab-bookmark"></select></label>
    </section>
    <section class="tab-media" aria-labelledby="tab-media-title">
      <div class="tab-section-heading"><h2 id="tab-media-title">Ресурсы со страницы</h2><div class="tab-media-actions"><button id="tab-manual-upload" class="settings-button" type="button" disabled>Загрузить вручную</button><button id="tab-pick" class="settings-button" type="button">Выбрать на странице</button><button id="tab-rescan" class="settings-button" type="button">Обновить</button></div></div>
      <p id="tab-directory-status"></p>
      <button id="tab-grant-access" class="settings-button" type="button" hidden>Разрешить доступ к папке</button>
      <p id="tab-frame-status"></p>
      <button id="tab-grant-frames" class="settings-button" type="button" hidden>Искать во встроенных плеерах</button>
      <p id="tab-media-status" role="status" aria-live="polite">Ищем видео и изображения…</p>
      <ul id="tab-media-list"></ul>
    </section>
    <section id="download-panel" class="download-panel" aria-labelledby="download-heading" hidden>
      <div class="download-heading">
        <h2 id="download-heading">Загрузки</h2>
        <button id="download-clear" class="settings-button" type="button" disabled>Очистить завершённые</button>
      </div>
      <p id="download-status" role="status" aria-live="polite"></p>
      <p id="download-hint"></p>
      <ol id="download-list" aria-label="Очередь загрузок"></ol>
    </section>
  </main>
  <dialog id="resource-dialog" aria-labelledby="resource-title">
    <div class="resource-dialog-heading">
      <h2 id="resource-title"></h2>
      <form method="dialog"><button class="settings-button" aria-label="Закрыть ресурсы">Закрыть</button></form>
    </div>
    <div class="resource-dialog-body">
      <label for="bookmark-tags">Теги закладки</label>
      <div class="resource-tags"><input id="bookmark-tags" placeholder="работа, прочитать" disabled><button id="save-tags" class="settings-button" type="button" disabled>Сохранить теги</button></div>
      <p class="resource-hint">Разделяйте теги запятыми. Теги относятся ко всем ресурсам этой закладки.</p>
      <div class="resource-actions"><button id="resource-upload" class="settings-button" type="button" disabled>Добавить файлы</button><button id="grant-resource-access" class="settings-button" type="button" hidden>Разрешить доступ</button><a href="settings.html?from=tab">Настройки папки</a></div>
      <input id="resource-files" type="file" multiple hidden>
      <label for="resource-url">Прямая ссылка на файл</label>
      <form id="resource-url-form" class="resource-tags">
        <input id="resource-url" type="url" placeholder="https://example.com/image.jpg" required disabled>
        <button id="resource-url-download" class="settings-button" type="submit" disabled>Загрузить по ссылке</button>
      </form>
      <p id="resource-message" role="status" aria-live="polite"></p>
      <ul id="resource-list"></ul>
      <div id="resource-preview"></div>
    </div>
  </dialog>
</body>
</html>
